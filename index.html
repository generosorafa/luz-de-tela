<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta
      name="description"
      content="Use a tela do celular como luz: escolha tela branca, luz vermelha, tons quentes ou qualquer cor RGB e ajuste a intensidade. Grátis e sem cadastro."
    />
    <meta name="robots" content="index, follow" />
    <meta name="theme-color" content="#000000" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Luz de Tela" />
    <link rel="canonical" href="https://generosorafa.github.io/luz-de-tela/" />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="pt_BR" />
    <meta property="og:site_name" content="Luz de Tela" />
    <meta property="og:url" content="https://generosorafa.github.io/luz-de-tela/" />
    <meta property="og:title" content="Luz de Tela: tela branca, vermelha e RGB" />
    <meta
      property="og:description"
      content="Use a tela do celular para iluminar com branco, vermelho, tons quentes ou qualquer cor RGB."
    />
    <meta
      property="og:image"
      content="https://generosorafa.github.io/luz-de-tela/og.png"
    />
    <meta property="og:image:width" content="1536" />
    <meta property="og:image:height" content="1024" />
    <meta
      property="og:image:alt"
      content="Luz de Tela. Uma luz simples, quando precisar."
    />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Luz de Tela: tela branca, vermelha e RGB" />
    <meta
      name="twitter:description"
      content="Use a tela do celular para iluminar com branco, vermelho, tons quentes ou qualquer cor RGB."
    />
    <meta
      name="twitter:image"
      content="https://generosorafa.github.io/luz-de-tela/og.png"
    />
    <title>Luz de Tela: tela branca, vermelha e RGB para iluminar</title>
    <link rel="manifest" href="manifest.webmanifest?v=5" />
    <link rel="sitemap" type="application/xml" href="sitemap.xml" />
    <link rel="icon" href="icons/icon-192.png" />
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
    <link rel="stylesheet" href="styles.css?v=5" />
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "Luz de Tela",
        "alternateName": "Luz de tela para celular",
        "url": "https://generosorafa.github.io/luz-de-tela/",
        "description": "Transforme a tela do celular em uma luz branca, vermelha ou RGB com intensidade ajustável.",
        "applicationCategory": "UtilitiesApplication",
        "operatingSystem": "Any",
        "browserRequirements": "Requires JavaScript",
        "inLanguage": "pt-BR",
        "isAccessibleForFree": true,
        "featureList": [
          "Tela branca em tons gelo, natural e quente",
          "Luz vermelha",
          "Seletor de cores RGB",
          "Intensidade ajustável",
          "Temporizador de desligamento"
        ],
        "offers": {
          "@type": "Offer",
          "price": "0",
          "priceCurrency": "BRL"
        }
      }
    </script>
  </head>
  <body>
    <div class="app-shell">
      <section class="controls-screen" id="controlsScreen" aria-labelledby="appTitle">
        <header class="topbar">
          <h1 id="appTitle">Luz de Tela<span aria-hidden="true">.</span></h1>
          <div class="topbar-actions">
            <a
              class="about-link"
              href="sobre/"
              aria-label="Sobre o Luz de Tela"
              title="Sobre"
            >
              <span aria-hidden="true">i</span>
            </a>
            <button class="install-button" id="installButton" type="button" hidden>
              Instalar
            </button>
          </div>
        </header>

        <main class="tool">
          <p class="tagline">Para o quarto, a mesa ou uma foto.</p>

          <fieldset class="tone-fieldset">
            <legend>Cor</legend>
            <div class="tone-picker" id="presetGrid">
              <button
                class="tone-option selected"
                type="button"
                data-color="#ff3b30"
                data-name="Vermelha"
                aria-pressed="true"
              >
                <span class="tone-swatch red" aria-hidden="true"></span>
                <span>Vermelha</span>
              </button>
              <button
                class="tone-option"
                type="button"
                data-color="#edf5ff"
                data-name="Branco gelo"
                aria-pressed="false"
              >
                <span class="tone-swatch ice" aria-hidden="true"></span>
                <span>Gelo</span>
              </button>
              <button
                class="tone-option"
                type="button"
                data-color="#fffdf7"
                data-name="Branco natural"
                aria-pressed="false"
              >
                <span class="tone-swatch natural" aria-hidden="true"></span>
                <span>Natural</span>
              </button>
              <button
                class="tone-option"
                type="button"
                data-color="#ffdca8"
                data-name="Branco quente"
                aria-pressed="false"
              >
                <span class="tone-swatch warm" aria-hidden="true"></span>
                <span>Quente</span>
              </button>
              <label class="tone-option custom-tone">
                <input
                  id="customColor"
                  type="color"
                  value="#66d9c7"
                  aria-label="Escolher outra cor"
                />
                <span class="tone-swatch custom-swatch" id="customSwatch" aria-hidden="true"></span>
                <span>RGB</span>
              </label>
            </div>
          </fieldset>

          <div class="intensity-control">
            <label for="intensity">Intensidade</label>
            <output id="intensityValue" for="intensity">35%</output>
            <input
              id="intensity"
              class="range"
              type="range"
              min="5"
              max="100"
              value="35"
              aria-label="Intensidade da luz"
            />
          </div>

          <fieldset class="timer-fieldset">
            <legend>Temporizador</legend>
            <div class="timer-options" id="timerOptions">
              <button
                class="timer-option selected"
                type="button"
                data-minutes="0"
                aria-pressed="true"
              >
                Sem timer
              </button>
              <button class="timer-option" type="button" data-minutes="5" aria-pressed="false">
                5 min
              </button>
              <button class="timer-option" type="button" data-minutes="15" aria-pressed="false">
                15 min
              </button>
              <button class="timer-option" type="button" data-minutes="30" aria-pressed="false">
                30 min
              </button>
            </div>
          </fieldset>

          <button class="primary-action" id="turnOn" type="button">
            <span class="power-symbol" aria-hidden="true"></span>
            Acender
          </button>
          <p class="selection-summary" id="selectionSummary" aria-live="polite">
            Vermelha · 35%
          </p>
          <p class="sr-only" id="timerStatus" aria-live="assertive"></p>
        </main>
      </section>

      <dialog class="install-dialog" id="installDialog" aria-labelledby="installTitle">
        <div class="install-dialog-content">
          <div class="install-dialog-header">
            <h2 id="installTitle">Instalar Luz de Tela</h2>
            <button class="install-close" id="installClose" type="button" aria-label="Fechar">
              ×
            </button>
          </div>
          <p>No Safari, toque em Compartilhar e depois em Adicionar à Tela de Início.</p>
          <button class="dialog-action" id="installDone" type="button">Entendi</button>
        </div>
      </dialog>

      <section
        class="light-stage"
        id="lightStage"
        role="button"
        tabindex="0"
        aria-label="Luz ligada. Toque para apagar."
        aria-hidden="true"
      >
        <div class="stage-feedback" id="stageFeedback" aria-live="polite">
          <strong id="stageIntensity">35%</strong>
          <span>Intensidade</span>
        </div>
        <span class="tap-hint">
          <span class="stage-timer" id="stageTimer" hidden></span>
          <span aria-hidden="true"></span>Deslize para ajustar · toque para apagar
        </span>
      </section>
    </div>

    <script src="app.js?v=5" defer></script>
  </body>
</html>
